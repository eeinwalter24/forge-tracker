<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Forge — Fitness &amp; Calorie Tracker</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◈</span>
    <span class="brand-name">Forge</span>
  </div>
  <div class="topbar-right">
    <span id="today-label" class="today-label"></span>
    <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab is-active" data-view="dashboard" role="tab">Today</button>
  <button class="tab" data-view="food" role="tab">Food</button>
  <button class="tab" data-view="train" role="tab">Train</button>
  <button class="tab" data-view="progress" role="tab">Progress</button>
  <button class="tab" data-view="history" role="tab">History</button>
  <button class="tab" data-view="coach" role="tab">Coach</button>
</nav>

<main id="app"></main>

<div id="modal-root"></div>

<footer class="foot">
  <span>All data lives in this browser only. <button class="linklike" id="btn-export">Export</button> · <button class="linklike" id="btn-import">Import</button></span>
</footer>

<input type="file" id="import-file" accept="application/json" hidden>

<script src="js/store.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/foods.js"></script>
<script src="js/workouts.js"></script>
<script src="js/charts.js"></script>
<script src="js/records.js"></script>
<script src="js/coach.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
