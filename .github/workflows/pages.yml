name: Deploy Forge to GitHub Pages

# A Pages site is publicly reachable even when the repository is private, so
# this publishes ONLY the application files. The README carries personal health
# details and stays out of the deployed site, as do the tests and the bundles.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'js/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site from app files only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r js _site/
          echo "Deploying:"
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
